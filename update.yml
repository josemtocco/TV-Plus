name: Update M3U Playlist

on:
  schedule:
    # A cada 6 horas (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:  # permite rodar manualmente

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run updater
        run: python3 update_playlist.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lista_ssiptv.m3u state.json
          if git diff --staged --quiet; then
            echo "Nenhuma alteração."
          else
            git commit -m "chore: atualiza lista M3U $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
